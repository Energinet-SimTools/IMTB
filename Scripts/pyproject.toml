[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "IMTB"
version = "1.3"
description = "Immittance Measurement Toolbox"
requires-python = ">=3.9"

dependencies = [
    "FreeSimpleGUI",
    "xml-python",
    "mhi-pscad",
    "mhi-psout",
    "mhi-xml",
    "numpy",
    "pandas",
    "lxml",
    "plotly",
    "tqdm",
    "openpyxl",
]

[tool.setuptools]
py-modules = []